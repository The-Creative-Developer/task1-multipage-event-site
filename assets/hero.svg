    <rect x="480" y="40" width="14" height="14" rx="3"/>
    <rect x="500" y="60" width="10" height="10" rx="2" opacity="0.7"/>
    <rect x="40" y="70" width="12" height="12" rx="3" opacity="0.8"/>
    <rect x="60" y="100" width="8" height="8" rx="2" opacity="0.6"/>
