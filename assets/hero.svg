    <circle cx="90" cy="330" r="18"/><rect x="66" y="350" width="48" height="50" rx="16"/>
    <circle cx="160" cy="340" r="18"/><rect x="136" y="360" width="48" height="50" rx="16"/>
    <circle cx="230" cy="330" r="18"/><rect x="206" y="350" width="48" height="50" rx="16"/>
    <circle cx="300" cy="345" r="18"/><rect x="276" y="365" width="48" height="50" rx="16"/>
  </g>
  <!-- pixels -->
