  <rect x="135" y="195" width="80" height="24" rx="12" fill="#ffb020"/>
  <!-- speaker -->
  <circle cx="400" cy="275" r="22" fill="#ffb020"/>
  <rect x="378" y="300" width="44" height="60" rx="14" fill="#ffb020"/>
  <rect x="360" y="330" width="80" height="60" rx="6" fill="#2a2096"/>
