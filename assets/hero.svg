  </defs>
  <rect width="560" height="420" rx="18" fill="url(#bg)"/>
  <!-- stage screen -->
  <rect x="110" y="50" width="340" height="190" rx="10" fill="#ffffff" opacity="0.96"/>
  <rect x="135" y="75" width="150" height="16" rx="4" fill="#3b2fc9"/>
  <rect x="135" y="102" width="220" height="10" rx="4" fill="#c9c2ff"/>
